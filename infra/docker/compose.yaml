# ON HOLD (ADR-0012): local development currently uses a locally installed PostgreSQL 18.
# This file is kept for when Keycloak, Redis and MinIO are needed (Phase 2 onwards).
# Start it manually with: docker compose -f infra/docker/compose.yaml up -d --wait
# All credentials here are development-only defaults.
name: eduplatform

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<version>, so mount the parent.
      - pgdata:/var/lib/postgresql
      # Roles (ADR-0009), the application database and Keycloak's database. Runs on first start only,
      # in file-name order: 01 roles, 02 application database, 03 Keycloak database.
      - ../database/roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
      - ./postgres/init/02-databases.sql:/docker-entrypoint-initdb.d/02-databases.sql:ro
      - ./postgres/init/03-keycloak.sql:/docker-entrypoint-initdb.d/03-keycloak.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eduplatform']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_PORT: 8080
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # The image has no curl; ask the management port (9000) with bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  minio:
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  minio:
