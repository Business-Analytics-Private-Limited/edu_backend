# Operational endpoints. Not a business module; always available.
openapi: 3.1.0
info:
  title: System
  version: 1.0.0
tags:
  - name: system
    description: Health checks
paths:
  /health:
    get:
      operationId: system.health.live
      summary: Liveness
      description: Returns 200 while the process is running. Used by container orchestration.
      tags: [system]
      security: []
      x-module: system
      x-permission: public
      x-audit: false
      parameters:
        - $ref: 'common.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: The process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ok
  /health/ready:
    get:
      operationId: system.health.ready
      summary: Readiness
      description: Returns 200 when the API can reach its database; 503 otherwise.
      tags: [system]
      security: []
      x-module: system
      x-permission: public
      x-audit: false
      parameters:
        - $ref: 'common.yaml#/components/parameters/RequestId'
      responses:
        '200':
          description: Ready to serve traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ok
                  checks:
                    database: ok
        '503':
          $ref: 'common.yaml#/components/responses/ServiceUnavailable'
components:
  schemas:
    HealthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
            checks:
              type: object
              additionalProperties:
                type: string
                enum: [ok]
