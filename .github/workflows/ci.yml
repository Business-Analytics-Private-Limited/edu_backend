name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # PostgreSQL 18 for the end-to-end tests, like a developer's local install.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://edu_app:edu_app@localhost:5432/eduplatform
      DIRECT_DATABASE_URL: postgres://edu_owner:edu_owner@localhost:5432/eduplatform
      JWT_SECRET: ci-secret-that-is-long-enough-for-tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build
